name: Code Quality
on: push
jobs:
  sniff:
    name: phpcs
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.0
      - name: Install dependencies
        uses: "ramsey/composer-install@v2"
      - name: Run phpcs
        run: make phpcs
  phpstan:
    name: phpstan on PHP 7.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.0
      - name: Install dependencies
        uses: "ramsey/composer-install@v2"
      - name: Run phpstan
        run: make phpstan
  phan:
    name: phan on PHP 7.0
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      - name: Setup PHP 7.0
        uses: shivammathur/setup-php@v2
        with:
          php-version: 7.0
      - name: Install dependencies
        uses: "ramsey/composer-install@v2"
      - name: Run phan
        run: make phan
